# The Validatopia wallet API (port 6000, and 8443 with TLS): what wallets and verifiers need — the
# issuer's OpenID4VCI and identity-proofing endpoints under /openid4vci, the device-attestation
# backend under /backend, and the .well-known documents. The admin site and its /admin_* API are
# served only on the admin port (nginx-validatopia-admin.conf) and are not found here.
#
# The issuer's base URL is BASE_URL/openid4vci, so its endpoints are reached under /openid4vci/;
# the rate limits and denials below apply there, and also to the same paths at the root.

include /etc/nginx/conf.d/validatopia-common.conf;

# Wallets look up the metadata of an issuer with a path (BASE_URL/openid4vci) by inserting
# /.well-known/... before that path (RFC 8414 and OpenID4VCI), as in the full bundle's nginx.conf.
location = /.well-known/oauth-authorization-server/openid4vci {
    proxy_pass http://openid4vci/.well-known/oauth-authorization-server;
}

location = /.well-known/openid-credential-issuer/openid4vci {
    proxy_pass http://openid4vci/.well-known/openid-credential-issuer;
}

location = /.well-known/oauth-authorization-server {
    proxy_pass http://openid4vci/.well-known/oauth-authorization-server;
}

location = /.well-known/openid-credential-issuer {
    proxy_pass http://openid4vci/.well-known/openid-credential-issuer;
}

location = /.well-known/assetlinks.json {
    proxy_pass http://backend/.well-known/assetlinks.json;
}

location = /.well-known/apple-app-site-association {
    proxy_pass http://backend/.well-known/apple-app-site-association;
}

# Denied outright (Component E): only reachable from the issuer's own loopback interface, which
# never comes through nginx.
location = /preauthorized_offer {
    return 403;
}
location = /openid4vci/preauthorized_offer {
    return 403;
}

# The admin site and API live on the admin port only.
location ^~ /admin_ {
    return 404;
}
location ^~ /openid4vci/admin_ {
    return 404;
}
location ~ ^/openid4vci/(admin|session)\.html$ {
    return 404;
}

location /idv/ {
    limit_req zone=idv burst=5 nodelay;
    proxy_pass http://openid4vci/idv/;
}
location /openid4vci/idv/ {
    limit_req zone=idv burst=5 nodelay;
    proxy_pass http://openid4vci/idv/;
}

location = /token {
    limit_req zone=token burst=10 nodelay;
    proxy_pass http://openid4vci/token;
}
location = /openid4vci/token {
    limit_req zone=token burst=10 nodelay;
    proxy_pass http://openid4vci/token;
}

location = /credential {
    limit_req zone=token burst=10 nodelay;
    proxy_pass http://openid4vci/credential;
}
location = /openid4vci/credential {
    limit_req zone=token burst=10 nodelay;
    proxy_pass http://openid4vci/credential;
}

location /openid4vci/ {
    proxy_pass http://openid4vci/;
}
location = /openid4vci {
    return 302 /openid4vci/;
}

location /backend/ {
    proxy_pass http://backend/;
}
location = /backend {
    return 302 /backend/;
}

location / {
    return 404;
}
