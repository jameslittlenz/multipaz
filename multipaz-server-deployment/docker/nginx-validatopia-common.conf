# Shared between the plain-HTTP (port 8000) and, when TLS_CERT/TLS_KEY are mounted, the TLS
# (port 8443) server blocks for the Validatopia profile — see nginx-validatopia.conf and
# start-servers.sh's setup_tls(). Kept in one file so the two listeners can never drift apart.
#
# The expected deployment puts this container behind another reverse proxy (e.g. Caddy) that
# terminates the public TLS connection and forwards to nginx over plain HTTP/the docker network —
# rather than TLS_CERT/TLS_KEY being mounted here directly. Without the realip block below, every
# request would look to nginx like it came from that fronting proxy's own address: rate limiting
# (limit_req_zone, keyed on $binary_remote_addr) would lump every real client together, and
# ADMIN_ALLOW_CIDR would be checked against the wrong address entirely.
#
# set_real_ip_from only trusts private-network peers: a public-internet client cannot spoof a
# private source address at the TCP layer (routers/NAT already rewrite it), so this only ever
# takes effect for a proxy actually sitting on the same host or docker network — never for a
# request that reached nginx directly from the internet.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# Preserves the fronting proxy's own X-Forwarded-Proto (e.g. Caddy correctly says "https" for a
# connection it terminated) instead of overwriting it with nginx's own (always "http" here)
# scheme; only falls back to $scheme when nothing upstream set the header at all.
proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;

# Security headers on every response. HSTS is meaningful even when a given listener speaks plain
# HTTP, if TLS instead terminates at an external platform proxy in front of it
# (docs/validatopia/PLAN.md's Component E) — browsers only honor it on responses they actually
# received over HTTPS.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'" always;

location = /.well-known/oauth-authorization-server {
    proxy_pass http://openid4vci/.well-known/oauth-authorization-server;
}

location = /.well-known/openid-credential-issuer {
    proxy_pass http://openid4vci/.well-known/openid-credential-issuer;
}

location = /.well-known/assetlinks.json {
    proxy_pass http://backend/.well-known/assetlinks.json;
}

location = /.well-known/apple-app-site-association {
    proxy_pass http://backend/.well-known/apple-app-site-association;
}

# Denied outright (Component E): only reachable from the issuer's own loopback interface, which
# never comes through nginx.
location = /preauthorized_offer {
    return 403;
}

location /idv/ {
    limit_req zone=idv burst=5 nodelay;
    proxy_pass http://openid4vci/idv/;
}

location /admin_ {
    limit_req zone=admin burst=10 nodelay;
    proxy_pass http://openid4vci/admin_;
}

location = /token {
    limit_req zone=token burst=10 nodelay;
    proxy_pass http://openid4vci/token;
}

location = /credential {
    limit_req zone=token burst=10 nodelay;
    proxy_pass http://openid4vci/credential;
}

location /openid4vci/ {
    proxy_pass http://openid4vci/;
}
location = /openid4vci {
    return 302 /openid4vci/;
}

location /backend/ {
    proxy_pass http://backend/;
}
location = /backend {
    return 302 /backend/;
}

location = / {
    return 302 /openid4vci/admin.html;
}

location /health {
    default_type application/json;
    return 200 '{"status":"ok"}';
}
