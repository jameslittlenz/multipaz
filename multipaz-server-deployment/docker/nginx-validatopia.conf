# Validatopia profile nginx reverse proxy (docs/validatopia/PLAN.md's Component G).
#
# Unlike the default bundle's nginx.conf, this profile only fronts the openid4vci (issuer/admin
# site) and backend (device-attestation) services: the records, CSA and verifier servers are not
# started for this profile (Component E: "the records, CSA and verifier servers are not started
# in this profile").
#
# Security hardening (Component E/G): rate limiting on the sensitive paths, security headers on
# every response, request body size limits, and an explicit deny on /preauthorized_offer (the
# code-level guard in preauthorizedOffer.kt is defense in depth, not the primary control).

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Body size limit (Component E): evidence submissions are CBOR capped at 2MB server-side
    # (see idvEvidence.kt); reject anything grossly larger before it reaches the JVM.
    client_max_body_size 4m;

    # Rate limiting (Component E/G): keyed by client address (post-realip — see
    # nginx-validatopia-locations.conf — so a fronting reverse proxy like Caddy doesn't make every
    # client look like the same address), a generous but real ceiling for a small demo deployment.
    # Tune to expected traffic before a larger public event.
    limit_req_zone $binary_remote_addr zone=idv:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=token:10m rate=20r/m;
    limit_req_status 429;

    # Passes through a fronting proxy's own X-Forwarded-Proto (see
    # nginx-validatopia-locations.conf) instead of always overwriting it with this server's own
    # (always plain HTTP) scheme.
    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    upstream openid4vci {
        server 127.0.0.1:8007;
    }

    upstream backend {
        server 127.0.0.1:8008;
    }

    server {
        listen 8000;
        server_name _;

        # Shared with the TLS server block start-servers.sh generates below, so the two listeners
        # can never drift apart; see nginx-validatopia-locations.conf.
        include /etc/nginx/conf.d/validatopia-locations.conf;
    }

    # Populated by start-servers.sh with a `listen 8443 ssl;` server block (also including
    # validatopia-locations.conf) when TLS_CERT/TLS_KEY are mounted; left empty (no TLS)
    # otherwise. Kept out of this checked-in file because the cert/key paths are only known at
    # container run time.
    include /etc/nginx/conf.d/validatopia-tls-server.conf;
}
