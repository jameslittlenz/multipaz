# The Validatopia admin site (port 6001, and 8444 with TLS): the issuer's admin pages, their
# scripts and styles, and the /admin_* API they call — nothing else. The pages call the API
# relative to their own location, so both stay under /openid4vci/, as on the issuer itself.
# ADMIN_ALLOW_CIDR is enforced by the issuer on every /admin_* call.

include /etc/nginx/conf.d/validatopia-common.conf;

location = / {
    return 302 /openid4vci/admin.html;
}

location ^~ /openid4vci/admin_ {
    limit_req zone=admin burst=10 nodelay;
    proxy_pass http://openid4vci/admin_;
}

location ~ ^/openid4vci/(admin\.html|session\.html|[A-Za-z0-9_-]+\.(js|css|png|jpg))$ {
    rewrite ^/openid4vci/(.*)$ /$1 break;
    proxy_pass http://openid4vci;
}

location / {
    return 404;
}
